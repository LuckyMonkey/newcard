<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Namespaces and collisions</title>
  <rect width="960" height="380" rx="16" fill="#FBFAF7"/>
  <text x="20" y="36" font-size="20" font-weight="700" fill="#1D1D1B">One UID, two places: namespaces keep them apart</text>

  <!-- two physical cards -->
  <g>
    <rect x="20" y="70" width="170" height="104" rx="10" fill="#3E5C76"/>
    <path d="M20 140 C70 120 120 160 190 130 V164 a10 10 0 0 1 -10 10 H30 a10 10 0 0 1 -10 -10 Z" fill="#5C7A94"/>
    <rect x="36" y="88" width="30" height="22" rx="4" fill="#D9C27A"/>
    <text x="36" y="200" font-size="13" fill="#4A4945">Café table card</text>
    <rect x="20" y="222" width="170" height="104" rx="10" fill="#D9822B"/>
    <path d="M20 292 C70 272 120 312 190 282 V316 a10 10 0 0 1 -10 10 H30 a10 10 0 0 1 -10 -10 Z" fill="#E59A52"/>
    <rect x="36" y="240" width="30" height="22" rx="4" fill="#D9C27A"/>
    <text x="36" y="352" font-size="13" fill="#4A4945">Hotel lobby card</text>
  </g>
  <text x="105" y="140" font-size="13" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, monospace">A2 7F 91 04</text>
  <text x="105" y="292" font-size="13" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, monospace">A2 7F 91 04</text>

  <!-- registry -->
  <rect x="230" y="70" width="330" height="256" rx="12" fill="#FFFFFF" stroke="#DEDBD2"/>
  <text x="248" y="98" font-size="15" font-weight="700" fill="#1D1D1B">Registry bindings</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#4A4945">
    <rect x="248" y="114" width="294" height="60" rx="8" fill="#EEF2F6"/>
    <text x="260" y="136">demo.restaurant · iso14443a · A27F…</text>
    <text x="260" y="158" fill="#3E5C76">→ nc_7c1e… “Table menu”</text>
    <rect x="248" y="186" width="294" height="60" rx="8" fill="#FBEBDD"/>
    <text x="260" y="208">demo.hotel · iso14443a · A27F…</text>
    <text x="260" y="230" fill="#9A5410">→ nc_b04d… “Lobby info”</text>
  </g>
  <text x="248" y="272" font-size="12" fill="#6B6A65">A second card with the same UID in the</text>
  <text x="248" y="290" font-size="12" fill="#6B6A65">same namespace is refused: the two</text>
  <text x="248" y="308" font-size="12" fill="#6B6A65">cards could never be told apart.</text>

  <!-- lookups -->
  <g font-size="13" fill="#4A4945">
    <rect x="600" y="70" width="340" height="72" rx="10" fill="#FBEBDD" stroke="#D9822B"/>
    <text x="616" y="96" font-weight="700" fill="#9A5410">Lookup with no namespace</text>
    <text x="616" y="118">two matches → 409 ambiguous</text>
    <text x="616" y="134" font-size="12" fill="#6B6A65">The resolver never guesses.</text>

    <rect x="600" y="162" width="340" height="72" rx="10" fill="#E6F2EA" stroke="#3F8F5A"/>
    <text x="616" y="188" font-weight="700" fill="#2C6B43">ns = demo.restaurant</text>
    <text x="616" y="210">→ “Table menu”</text>

    <rect x="600" y="254" width="340" height="72" rx="10" fill="#E6F2EA" stroke="#3F8F5A"/>
    <text x="616" y="280" font-weight="700" fill="#2C6B43">ns = demo.hotel</text>
    <text x="616" y="302">→ “Lobby info”</text>
  </g>
  <text x="600" y="356" font-size="12" fill="#6B6A65">The namespace comes from the app or venue, not from the card.</text>
</svg>
